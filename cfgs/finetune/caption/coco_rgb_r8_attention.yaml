# LoRA fine-tuning on COCO captioning (RGB → text)
#
# Run 23b: rank=8, selfattn+crossattn (attention), dropout=0.1, blr=3e-5
# FIXED vs run 23: padding tokens (id=0) are excluded from the loss via
# build_mod_dict(mask_padding=True).  With ~80% padding in caption sequences
# (avg caption = 12 tokens on 64 positions), run 23 learned to predict zeros
# in 2 epochs → val/token_acc=0.787 ≈ all-zeros baseline (0.806).
# Fix makes the loss computed only on real caption tokens.
# Patience raised 10→20 to allow proper convergence.
#
# Train subset: 10k images sampled from COCO train2017 (seed=42).
# Val: full COCO val2017 (5000 images).

pretrained_model: 'EPFL-VILAB/4M-21_XL'
dtype: bfloat16

# LoRA
lora_rank: 8
lora_scale: 1.0
lora_modules: attention       # selfattn + crossattn
lora_dropout: 0.1

# Task
task: caption
input_mod: 'tok_rgb@224'
num_input_tokens: 196
num_target_tokens: 64
loss_type: mod

# Training
#   4 GPUs x bs=2 x accum=4 = 32 effective batch size
epochs: 50
batch_size: 2
accum_iter: 4
blr: 3.0e-5
min_blr: 0.0
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 5
eval_freq: 1
save_ckpt_freq: 10
early_stop_patience: 20

# Data (output of scripts/prepare_coco.py --n_train 10000 --seed 42)
data_path: '/scratch-shared/tesr125338/coco_tokens/train'
eval_data_path: '/scratch-shared/tesr125338/coco_tokens/val'
num_workers: 8

# Output
output_dir: '/scratch-shared/tesr125338/output/caption/coco_rgb_r8_attention_v2'

# WandB
log_wandb: true
wandb_project: '4M-PEFT'
wandb_entity: 'francesco-colasurdo04-eindhoven-university-of-technology'
wandb_run_name: 'lora_caption_coco_r8_attention_v2_padfix'
