# LoRA fine-tuning on NYUv2 depth estimation — 5-epoch validation run
#
# Purpose: verify that LoRA training on 4M-21_XL:
#   (1) loss decreases over 5 epochs (model is learning)
#   (2) no crashes, NaN, or OOM on real data (47k samples)
#   (3) gradient flow is stable end-to-end
#
# After this passes → run nyu_rgb_r8.yaml for the full 50-epoch baseline.

# Model
pretrained_model: 'EPFL-VILAB/4M-21_XL'
dtype: bfloat16

# LoRA
lora_rank: 8
lora_scale: 1.0
lora_modules: attention

# Task
task: depth
input_mod: 'tok_rgb@224'
num_input_tokens: 196
num_target_tokens: 196
loss_type: mod

# Training
# 5 epochs × 743 steps/epoch ≈ 3715 total steps → ~2-3h on 4×A100
epochs: 5
batch_size: 2
accum_iter: 8
blr: 1.0e-4
min_blr: 0.0
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 1       # 1 warmup epoch (short run, keep it proportional)
eval_freq: 1           # evaluate every epoch to see learning curve clearly
save_ckpt_freq: 5      # save at the end (epoch 5)

# Data
data_path: '/scratch-shared/tesr125338/nyu_tokens/train'
eval_data_path: '/scratch-shared/tesr125338/nyu_tokens/val'
num_workers: 8

# Output (separate dir — doesn't pollute the full-run checkpoint dir)
output_dir: '/scratch-shared/tesr125338/output/depth/nyu_rgb_r8_e5'

# Logging
# Snellius compute nodes have no internet → offline mode.
# After the job completes, sync from the login node:
#   wandb sync ~/4m-peft/wandb/run-*/
log_wandb: true
wandb_project: '4m-peft'
wandb_entity: null
wandb_run_name: 'nyu_depth_r8_xl_e5_val'
wandb_mode: 'offline'
