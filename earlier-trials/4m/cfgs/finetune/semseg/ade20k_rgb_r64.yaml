# LoRA fine-tuning on ADE20K semantic segmentation (150 classes)
# Baseline config matching 4M-21 paper settings (rank=64, attention only)
# Reference: 4M-21 Appendix G

# Model
pretrained_model: 'EPFL-VILAB/4M-21_XL'
dtype: bfloat16

# LoRA
lora_rank: 64
lora_scale: 1.0
lora_modules: attention

# Task
task: semseg
input_mod: 'tok_rgb@224'
num_input_tokens: 196
num_target_tokens: 196
loss_type: mod

# Training
epochs: 50
batch_size: 8
accum_iter: 2
blr: 1.0e-4
min_blr: 0.0
weight_decay: 0.05
clip_grad: 1.0
warmup_epochs: 5
eval_freq: 5
save_ckpt_freq: 10

# Data (update paths on Snellius)
data_path: '/scratch-shared/tesr125338/ade20k_tokens/train'
eval_data_path: '/scratch-shared/tesr125338/ade20k_tokens/val'
num_workers: 8

# Output
output_dir: '/scratch-shared/tesr125338/output/semseg/ade20k_rgb_r64'

# Logging
log_wandb: false
wandb_project: '4m-peft'
wandb_entity: null
wandb_run_name: 'ade20k_semseg_r64_xl'
